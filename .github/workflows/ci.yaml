# Continuous Integration for Dwaar.
#
# What this is: every time code is pushed to main/mohammad, or a PR is opened
# against main, GitHub spins up a clean Ubuntu machine, checks out the code,
# and runs the same checks you'd normally run by hand (format, analyze, test).
# If any step fails, the run shows a red X on the commit/PR — that's the "gate."
# A green check means: this code is formatted, lint-clean, and every test passes.
#
# To reproduce/fix a failure locally before pushing again, see the comment
# above each step below — it names the exact local command.

name: CI

on:
  push:
    branches: [main, mohammad]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version verified locally during the project's health
          # audit (2026-07-02). There's no FVM/.fvmrc in this repo pinning a
          # version, so CI needs an explicit one — otherwise a new Flutter
          # release could silently break CI with zero code changes.
          # Bump this manually whenever you intentionally upgrade Flutter
          # locally, so CI stays in sync with what you actually run.
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env.local
        # .env.local is declared as a pubspec asset (pubspec.yaml:84) but is
        # gitignored (holds secrets), so it's absent on a clean CI checkout.
        # flutter analyze flags asset_does_not_exist if the file is missing,
        # and flutter test's asset bundle also needs it. The APK smoke-test
        # job already does the same — see build-apk below. Placeholder values
        # only; the app falls back to mock/offline mode when they're fake.
        run: |
          cat > .env.local <<'EOF'
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          GEMINI_API_KEY=placeholder
          EOF

      - name: Verify formatting
        # Local fix: dart format .
        # This only checks style (spacing, line breaks) — never logic. It
        # exists so every diff stays readable instead of accumulating
        # personal formatting preferences. The codebase was reformatted to
        # be 100% clean right before this workflow was added, so this step
        # is safe to block on from day one.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Local fix: flutter analyze (read the reported file:line, fix, re-run)
        # Catches real bugs and anti-patterns (unused code, missing null
        # checks, etc.) before they reach a device. This step fails the build
        # on errors/warnings; informational-only suggestions do not fail it.
        run: flutter analyze

      - name: Verify generated code is up to date
        # Local fix: dart run build_runner build --delete-conflicting-outputs
        # freezed/json_serializable output (order.freezed.dart, order.g.dart,
        # etc.) is committed to the repo. If someone edits order.dart and
        # forgets to regenerate, analyze/tests can still pass against the
        # stale .freezed.dart/.g.dart — this catches that drift by
        # regenerating in CI and failing if the regenerated output differs
        # from what's committed.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.freezed.dart' '*.g.dart' || \
            (echo "::error::Generated code is out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result." && exit 1)

      - name: Verify localization output is up to date
        # Local fix: flutter gen-l10n
        # lib/l10n/generated/ is committed but derived from the .arb files.
        # Same drift risk as build_runner output above — regenerate and diff.
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated || \
            (echo "::error::Localization output is out of date. Run 'flutter gen-l10n' and commit the result." && exit 1)

      - name: Run tests with coverage
        # Local fix: flutter test (add --coverage if you want the same
        # coverage.info this step produces)
        # Test failures are the one thing this workflow always blocks on —
        # a red test means the app's actual behavior broke, not just style.
        run: flutter test --coverage

      - name: Strip generated code from coverage report
        # lib/l10n/generated/** is auto-generated translation code (not
        # hand-written), so it shouldn't count toward how well YOUR code is
        # tested. This keeps the coverage number honest.
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info 'lib/l10n/generated/*' -o coverage/lcov.info

      - name: Print coverage summary
        # Shows the coverage percentage directly in this run's log — no
        # external account or token needed. This is informational only for
        # now (does not fail the build); see the audit report for why.
        run: lcov --summary coverage/lcov.info

      - name: Upload coverage report
        # Lets you download and inspect the full per-file coverage report
        # from this run's "Artifacts" section on GitHub, if you want more
        # detail than the summary above.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  build-apk:
    name: Build APK (smoke test)
    runs-on: ubuntu-latest
    # Runs in parallel with build-and-test, not gated by it — this job's
    # only purpose is to catch build-only breakage (bad asset refs, plugin
    # config, missing Android resources) that analyze/test don't exercise.
    # It intentionally does not block merge yet: see README note in this
    # file's history / PR description before flipping it to required.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env.local
        # .env.local is declared as a pubspec asset (main.dart loads it at
        # runtime, falling back to mock/offline mode if missing/empty) but
        # it's gitignored, so it doesn't exist on a clean checkout. flutter
        # build fails if a declared asset file is physically absent, so CI
        # needs *a* file here — the values are placeholders, never real
        # secrets, and only affect this throwaway debug build.
        run: |
          cat > .env.local <<'EOF'
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          GEMINI_API_KEY=placeholder
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

  check-migration-order:
    name: Supabase migration filename order
    runs-on: ubuntu-latest
    # Cheap (pure filename diff, no DB), so it just runs every time rather
    # than needing path-filter machinery to skip unrelated PRs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify migrations are in lexicographic (= chronological) order
        # Migration filenames encode ordering (00001_..., 20260628_..., ...)
        # and Supabase applies them in filename-sorted order. A misnamed or
        # backdated file silently reorders history for every future
        # `supabase db push`. This just re-sorts the directory listing and
        # fails if it doesn't match what's on disk — cheap, no live DB
        # needed. It does not validate the SQL itself; that still needs a
        # real `supabase db push --dry-run` against a linked project (not
        # set up here — see PR description).
        run: |
          cd supabase/migrations
          diff <(ls -1 *.sql) <(ls -1 *.sql | sort) || \
            (echo "::error::Migration filenames are not in sorted order. Rename so filenames sort chronologically." && exit 1)
